name: Test & lint
on: [push, pull_request]

env:
  RAILS_ENV: test
  PGHOST: localhost
  PGUSER: postgres

jobs:
  tests:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0', 'truffleruby']
        gemfile:
          - 'gemfiles/activerecord_8.0.0.gemfile'
          - 'gemfiles/activerecord_8.1.0.gemfile'
          - 'gemfiles/activerecord_main.gemfile'
        exclude:
          # Rails main needs Ruby 3.3.5+
          - gemfile: 'gemfiles/activerecord_main.gemfile'
            ruby: '3.2'
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cancan_postgresql_spec
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: '20'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests on sqlite
        run: DB=sqlite bundle exec rspec

      - name: Run tests on postgres
        run: DB=postgres bundle exec rspec

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: '20'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Run linter
        run: bundle exec rubocop
